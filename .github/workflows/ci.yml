name: Release APK Tests
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of an existing StockPilot APK (optional)
        required: false
        type: string
      suite:
        description: Release test suite
        type: choice
        options:
          - regression
          - smoke
        default: regression
      apk_artifact_id:
        description: Existing APK artifact ID (optional)
        required: false
        type: string
      apk_sha256:
        description: Expected APK SHA-256 (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mobilewright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Resolve release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - name: Download existing APK
        env:
          APK_URL: ${{ inputs.apk_url || vars.MOBILEWRIGHT_APK_URL }}
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_ID: ${{ inputs.apk_artifact_id || vars.MOBILEWRIGHT_APK_ARTIFACT_ID || '13338790340' }}
          APK_SHA256: ${{ inputs.apk_sha256 || vars.MOBILEWRIGHT_APK_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$APK_URL" ]; then
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              "$APK_URL" --output "$RUNNER_TEMP/StockPilot-B2B.apk"
            app_path="$RUNNER_TEMP/StockPilot-B2B.apk"
            echo 'APK source: configured HTTPS download' >> "$GITHUB_STEP_SUMMARY"
          else
            artifact_id="$APK_ARTIFACT_ID"
            if [ -z "$artifact_id" ]; then
              echo '::error::No existing APK is available. Set the MOBILEWRIGHT_APK_URL repository variable or provide apk_url when running this workflow.'
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/stockpilot-apk.zip"
            mkdir -p "$RUNNER_TEMP/stockpilot-apk"
            unzip -q "$RUNNER_TEMP/stockpilot-apk.zip" -d "$RUNNER_TEMP/stockpilot-apk"
            mapfile -t apks < <(find "$RUNNER_TEMP/stockpilot-apk" -type f -name '*.apk')
            if [ "${#apks[@]}" -ne 1 ]; then
              echo '::error::The APK artifact must contain exactly one APK.'
              exit 1
            fi
            app_path="${apks[0]}"
            echo "APK source: existing artifact $artifact_id" >> "$GITHUB_STEP_SUMMARY"
          fi
          unzip -t "$app_path" > /dev/null
          actual_sha=$(sha256sum "$app_path" | cut -d ' ' -f 1)
          if [ -n "$APK_SHA256" ] && [ "$actual_sha" != "${APK_SHA256,,}" ]; then
            echo '::error::The downloaded APK does not match the expected SHA-256.'
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          sha256sum "$app_path" >> "$GITHUB_STEP_SUMMARY"

        id: apk
      - name: Share the same APK with every test shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-apk-under-test
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1
          if-no-files-found: error
  android:
    name: Release APK tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || inputs.suite == 'smoke') && '[1]' || '[1,2,3]') }}
    defaults:
      run:
        working-directory: tests/mobilewright
    env:
      CI: '1'
      PLATFORM: android
      MOBILEWRIGHT_SHARD: ${{ matrix.shard }}/${{ (github.event_name == 'pull_request' || inputs.suite == 'smoke') && 1 || 3 }}
      PLAYWRIGHT_HTML_OPEN: never
      TEST_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'regression' }}
      RELEASE_APK_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - name: Check out tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/mobilewright/package-lock.json
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck test suite
        run: npm run typecheck
      - name: Download the resolved release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-apk-under-test
          path: ${{ runner.temp }}/stockpilot-apk
      - name: Locate APK
        run: |-
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/stockpilot-apk" -type f -name '*.apk')
          [ "${#apks[@]}" -eq 1 ]
          echo "APP_PATH=${apks[0]}" >> "$GITHUB_ENV"
          echo "Release APK SHA-256: $RELEASE_APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all Mobilewright test cases on Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -skin 720x1280
            -dpi-device 320 -feature -Vulkan
          disable-animations: true
          enable-hw-keyboard: true
          working-directory: tests/mobilewright
          script: bash ../../.github/scripts/run-mobilewright.sh
          heap-size: 256M
      - name: Upload Mobilewright report and device logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobilewright-android-report-${{ matrix.shard }}
          path: |
            tests/mobilewright/mobilewright-report/
            tests/mobilewright/test-results/
          retention-days: 30
          if-no-files-found: warn
    needs: prepare
