name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Expo dependency compatibility
            command: npx expo install --check
          - name: Android production bundle
            command: npx expo export --platform android --output-dir dist/android --max-workers 2
          - name: iOS production bundle
            command: npx expo export --platform ios --output-dir dist/ios --max-workers 2
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        # Match the existing APK workflow and the lockfile's peer resolution.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
