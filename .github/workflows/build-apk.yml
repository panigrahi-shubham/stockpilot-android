# Builds an installable StockPilot APK on GitHub's servers (no Android Studio needed).
# 1. Push this project to a GitHub repository (main/master branch).
# 2. Open the "Actions" tab → "Build Android APK" → wait ~10–15 min.
# 3. Download the "StockPilot-B2B-apk" artifact (zip containing the .apk).
# Tag a commit like v2.5.0 to also attach the APK to a GitHub Release.
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Build release APK (arm64 phones + x86_64 emulators)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "StockPilot-B2B-v${VERSION}.apk"
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StockPilot-B2B-apk
          path: StockPilot-B2B-v*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StockPilot-B2B-v*.apk
